# Run the app's tests, including the end-to-end test in headless Chrome
# (tests/testthat/test-app-browser.R) and the comparisons with dtpcrm.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testthat:
    runs-on: ubuntu-latest
    env:
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install packages
        run: |
          install.packages("pak")
          pak::pak(c(
            "dtptite", "shiny", "bslib", "bsicons", "htmltools", "ggplot2",
            "ggiraph", "rhandsontable", "readxl", "dfcrm", "escalation",
            "testthat", "withr", "writexl", "dtpcrm", "shinytest2", "chromote"
          ))
        shell: Rscript {0}

      - name: Test
        run: testthat::test_dir("tests/testthat", stop_on_failure = TRUE)
        shell: Rscript {0}
